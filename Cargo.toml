[package]
name = "beanieos"
version = "0.1.0"
authors = ["Author Name <jainarjav886@gmail.com>"]
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort" # disable stack unwinding on panic

[[bin]]
name = "beanieos"
test = false
bench = false

[dependencies]
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "once"] }
x86_64 = "0.15.5"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.10"
multiboot2 = "0.28.0"
crossbeam-queue = { version = "0.3.14", default-features = false, features = ["alloc"] }

fatfs = {
    git = "https://github.com/rafalh/rust-fatfs.git",
    default-features = false,
    features = ["alloc"]
}
