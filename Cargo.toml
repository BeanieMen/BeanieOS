[package]
name = "beanieos"
version = "0.1.0"
authors = ["Author Name <jainarjav886@gmail.com>"]
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 2

[[bin]]
name = "beanieos"
test = false
bench = false
required-features = ["kernel"]

[features]
kernel = []

[dependencies]
spin = { version = "0.10", default-features = false, features = [
    "mutex",
    "spin_mutex",
    "once",
] }
x86_64 = "0.15.5"
linked_list_allocator = "0.10"
multiboot2 = { version = "0.28.0", default-features = false }
pci_types = { version = "0.10", default-features = false }
pc-keyboard = "0.9.0"
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-tcp", "socket-udp", "socket-icmp", "socket-dhcpv4", "socket-dns"] }
