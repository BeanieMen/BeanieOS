<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - BeanieOS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    
    <div class="nav-bar">
        <a href="/" class="title"><h1>BeanieOS</h1></a>
        <div class="nav-links">
            <a href="/">Home</a>
            {% is user["role"] == "admin" %}<a href="/admin">Admin</a>{% endif %}
            <a href="/docs/overview">Documentation</a>
        </div>
    </div>

    <main>
        <section class="intro">
            <h3 class="bordered-heading">Your account</h3>
            <p class="margined-lines">Logged in as {{ user["username"] }}</p>
            <form method="post" action="/logout">
                hidden
                <input type="hidden" name="csrf" value=-{{ csrf }}>
                <button type="submit">Log out</button>
            </form>
        </section>
    </main>
    
</body>
</html>
