name: BeanieOS Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Rust components
        run: rustup component add llvm-tools-preview rust-src --toolchain nightly

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential llvm dosfstools mtools parted

      - name: Build BeanieOS disk image
        run: make

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            out/beanieos.img \
            --title "BeanieOS Build ${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" \
            --notes "Automated build from commit ${GITHUB_SHA}"